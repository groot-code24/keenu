[package]
name = "keenu-windows"
description = "Keenu's native Windows host: the island, WinRT and Win32 integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "keenu"
path = "src/main.rs"

[lib]
name = "keenu_windows"
path = "src/lib.rs"

[dependencies]
keenu-app.workspace = true
keenu-core.workspace = true
keenu-integrations.workspace = true
keenu-platform.workspace = true
keenu-security.workspace = true
keenu-ui.workspace = true

chrono.workspace = true
# Encodes clipboard images and rendered frames.
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Speech",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Puts the icon, version information and application manifest into keenu.exe.
embed-resource = "3"
