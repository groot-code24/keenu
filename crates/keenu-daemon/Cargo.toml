[package]
name = "keenu-daemon"
description = "Background service behind the Keenu island: media, lyrics, timers and system events over D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "keenud"
path = "src/main.rs"

[dependencies]
keenu-assistant.workspace = true
keenu-core.workspace = true
keenu-guard.workspace = true
keenu-integrations.workspace = true

anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures-util.workspace = true
image.workspace = true
inotify.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
# Keeps the keys of Claude Code's settings.json in their order when its hooks are changed.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
toml_edit.workspace = true
ureq.workspace = true
zbus.workspace = true
