[package]
name = "keenu-assistant"
description = "Keenu's assistant, shared by every system: the agent loop, the AIs behind it, and its file tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
keenu-core.workspace = true
keenu-guard.workspace = true
keenu-integrations.workspace = true
keenu-platform.workspace = true
keenu-security.workspace = true

anyhow.workspace = true
# Reads the nonce in a sign-in's ID token.
base64 = "0.22"
# Encrypts what the assistant remembers.
chacha20poly1305 = "0.10"
chrono.workspace = true
dirs.workspace = true
log.workspace = true
serde.workspace = true
# Keeps the keys of a CLI's settings in their order where they are read and written back.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
